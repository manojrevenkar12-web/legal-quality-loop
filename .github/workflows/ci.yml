name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests && ruff format --check src tests
      - run: pytest -q
      - name: Reports are reproducible
        run: |
          qloop develop
          python - <<'PY'
          import json
          new = json.load(open("reports/development.json"))
          assert new["calibration"]["selected"] == "judge-large/v2+checks"
          assert next(s for s in new["searches"] if s["name"] == "naive judge")["audit"]["flagged"]
          PY
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit && npx eslint src test
      - run: npx vitest run
      - run: npm run build
