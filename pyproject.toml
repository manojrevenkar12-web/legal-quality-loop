[project]
name = "qloop"
version = "1.0.0"
description = "An evaluation platform for a legal AI assistant: rubrics, calibrated judges, bounds, gates, guardrails and a guarded optimizer"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.110", "pydantic>=2.6", "numpy>=1.26", "scipy>=1.11", "scikit-learn>=1.4", "httpx>=0.27", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
qloop = "qloop.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src"]
